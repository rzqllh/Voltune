[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voltune"
version = "0.1.0"
description = "A state-aware Windows performance, maintenance, network, and recovery toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hafizh Rizqullah"}]
keywords = ["windows", "cli", "maintenance", "network", "gaming", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "rich>=13.7",
  "psutil>=5.9",
  "dnspython>=2.6",
]

[project.urls]
Homepage = "https://github.com/rzqllh/Voltune"
Repository = "https://github.com/rzqllh/Voltune"
Issues = "https://github.com/rzqllh/Voltune/issues"

[project.scripts]
voltune = "voltune.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
